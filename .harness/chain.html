<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/.harness/cc2.css">
<style>html{--font-h3--size:28px;--font-h1--size:64px;--font-heading--family:Georgia,serif;
 --gap-6xl:4rem;--page-margin:1rem;font-size:16px}</style></head><body>
<!-- 1: nada configurado -> manda el nivel (h3 = 28px) -->
<div class="collection-carousel" id="s1" style="--section-heading-level-size:var(--font-h3--size)">
  <h3 class="collection-carousel__heading" id="h1">Título</h3></div>
<!-- 2: preset personalizado -> --font-size del grupo de tipografía -->
<div class="collection-carousel" id="s2" style="--section-heading-level-size:var(--font-h3--size);--font-size:18px">
  <h3 class="collection-carousel__heading" id="h2">Título</h3></div>
<!-- 3: tamaño en px de la sección -> gana sobre todo -->
<div class="collection-carousel" id="s3" style="--section-heading-level-size:var(--font-h3--size);--font-size:18px;--collection-carousel-heading-size:50px">
  <h3 class="collection-carousel__heading" id="h3">Título</h3></div>
<!-- 4: nivel h1 elegido, nada más -> 64px -->
<div class="collection-carousel" id="s4" style="--section-heading-level-size:var(--font-h1--size)">
  <h1 class="collection-carousel__heading" id="h4">Título</h1></div>
<script>window.probe=()=>{const f=s=>getComputedStyle(document.querySelector(s)).fontSize;
 return {soloNivelH3:f('#h1'), conPreset:f('#h2'), conPxDeSeccion:f('#h3'), nivelH1:f('#h4')};};</script>
</body></html>
