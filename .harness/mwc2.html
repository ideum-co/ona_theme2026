<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/.harness/mwc2.css">
<style>body{margin:0}.phone{inline-size:390px;border:1px solid #ccc;margin-block-end:1rem}
html{--page-margin:1rem;--gap:1rem}</style></head><body>
<div class="phone">
 <div class="section section--page-width media-with-content media-with-content--mobile-text-center" id="on"
      style="--media-with-content-mobile-padding-inline:24px;">
  <div class="media-with-content__content" id="c-on">
   <div class="group-block-content layout-panel-flex layout-panel-flex--column" id="p-on"
        style="--horizontal-alignment:flex-start;">
     <!-- heading with no alignment of its own -->
     <div class="text-block" id="h-on"><h2>Find your Coffee</h2></div>
     <!-- paragraph WITH its own alignment, exactly what the section has today -->
     <div class="text-block text-block--align-left" id="t-on" style="--text-align: left;">
       <p id="p-text">Finding great coffee shouldn't be complicated.</p></div>
     <a class="button" id="b-on">Answer the quiz</a>
   </div>
  </div>
 </div>
</div>
<div class="phone">
 <div class="section section--page-width media-with-content" id="off">
  <div class="media-with-content__content">
   <div class="group-block-content layout-panel-flex layout-panel-flex--column"
        style="--horizontal-alignment:flex-start;">
     <div class="text-block" style="--text-align: left;"><p id="p-off">sin centrar</p></div>
   </div>
  </div>
 </div>
</div>
<script>window.probe=()=>{const cs=s=>getComputedStyle(document.querySelector(s));
 return {on:{heading:cs('#h-on > h2').textAlign, paragraph:cs('#p-text').textAlign,
             textBlockAlignItems:cs('#t-on').alignItems,
             inlineVar:document.querySelector('#t-on').style.getPropertyValue('--text-align')},
         off:{paragraph:cs('#p-off').textAlign}};};</script></body></html>
